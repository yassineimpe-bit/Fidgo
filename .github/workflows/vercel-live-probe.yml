name: vercel-live-probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe Vercel production
        shell: bash
        run: |
          set +e
          for url in \
            "https://fidgo-env-probe.vercel.app/" \
            "https://fidgo-env-probe.vercel.app/api/health" \
            "https://fidgo-env-probe.vercel.app/j/fidgo-demo"; do
            echo "===== $url ====="
            rm -f /tmp/headers /tmp/body
            code=$(curl --silent --show-error --max-time 20 -D /tmp/headers -o /tmp/body -w '%{http_code}' "$url")
            rc=$?
            echo "curl_rc=$rc http_code=$code"
            echo "--- headers ---"
            head -n 20 /tmp/headers 2>/dev/null || true
            echo "--- body ---"
            head -c 1500 /tmp/body 2>/dev/null || true
            echo
          done
          exit 0
