name: retiko-dispatcher

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap_labels:
        description: Créer les labels V1 manquants sans modifier les labels existants
        type: boolean
        default: false

permissions:
  contents: write       # Claude crée sa branche et y pousse ses modifications.
  issues: write         # Le dispatcher fait évoluer state:* et signale un blocage.
  pull-requests: write  # Claude ouvre la PR reviewable associée à l'issue.

# Couvre le claim ET toute l'exécution Claude : un seul worker V1 peut donc
# passer une issue à state:running. Les événements suivants attendent leur tour.
concurrency:
  group: retiko-claude-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Initialiser les labels V1 (option manuelle et idempotente)
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/retiko-dispatcher.mjs bootstrap
      - name: Réclamer au plus une issue
        id: claim
        if: github.event_name != 'workflow_dispatch' || !inputs.bootstrap_labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/retiko-dispatcher.mjs claim
      - name: Bloquer si le credential Claude manque
        if: steps.claim.outputs.status == 'claimed' && env.CLAUDE_CODE_OAUTH_TOKEN == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETIKO_ISSUE: ${{ steps.claim.outputs.issue }}
          RETIKO_FAILED: "true"
          RETIKO_REASON: "credential Claude absent ; configuration humaine requise."
        run: node scripts/retiko-dispatcher.mjs reconcile
      - name: Confier l'issue à Claude Code
        id: claude
        if: steps.claim.outputs.status == 'claimed' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Tu travailles sur Retiko.

            Repository : yassineimpe-bit/Fidgo.
            Issue assignée : #${{ steps.claim.outputs.issue }}.
            Source fonctionnelle : issue #88. État court : issue #224.
            Travaille uniquement sur l'issue assignée.

            Avant toute modification : fetch main ; lis l'issue complète, #224 et
            #88 lorsque nécessaire ; recherche une PR ou branche existante pour
            cette issue ; ne duplique pas un travail ; vérifie que l'issue reste
            actionnable. Crée depuis main actuel une branche
            retiko/issue-${{ steps.claim.outputs.issue }}-claude. Respecte strictement
            le scope. Ajoute ou adapte les tests pertinents. Exécute typecheck,
            lint, tests, build et les E2E pertinents. Ouvre une PR reviewable dont
            le body référence explicitement l'issue et contient exactement :
            <!-- retiko-dispatch:issue=${{ steps.claim.outputs.issue }} -->

            Ne merge jamais et ne pousse jamais sur main. Ne modifie ni #88 ni
            #224, aucun secret, aucune production, migration production, base de
            données réelle, Stripe live, Apple/Google/Vercel production. Ne
            supprime aucune donnée, ne valide aucun test physique, ne coche
            aucune validation physique dans #88, ne prends aucune décision
            juridique ou commerciale et ne fais aucun hors-scope opportuniste.
            Si une décision humaine est nécessaire, ne l'invente pas : arrête le
            travail concerné et signale clairement le blocage. Le résultat attendu
            est une PR reviewable liée à l'issue d'origine.
      - name: Passer l'issue en review si sa PR existe
        if: always() && steps.claim.outputs.status == 'claimed' && steps.claude.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETIKO_ISSUE: ${{ steps.claim.outputs.issue }}
          RETIKO_FAILED: "true"
          RETIKO_REASON: "Claude a terminé sans créer de PR portant le marker attendu."
        run: node scripts/retiko-dispatcher.mjs reconcile
      - name: Bloquer après un échec Claude
        if: always() && steps.claim.outputs.status == 'claimed' && steps.claude.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETIKO_ISSUE: ${{ steps.claim.outputs.issue }}
          RETIKO_FAILED: "true"
          RETIKO_REASON: "exécution Claude échouée avant la création d'une PR correspondante."
        run: node scripts/retiko-dispatcher.mjs reconcile
