name: Android TWA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-app/**"
      - "app/api/android/assetlinks/**"
      - "lib/android-app.ts"
      - "tests/android-assetlinks.test.ts"
      - "next.config.ts"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android 16 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK and release bundle
        working-directory: android-app
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug :app:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: retiko-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: retiko-android-release-aab-unsigned
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
