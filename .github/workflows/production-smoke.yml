name: production-smoke

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HEALTH_URL: https://fidgo-env-probe.vercel.app/api/health
    steps:
      - name: Wait for Vercel production health
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for $HEALTH_URL"
          body=""
          for attempt in $(seq 1 20); do
            echo "Attempt $attempt/20"
            if body=$(curl --silent --show-error --fail --max-time 15 "$HEALTH_URL"); then
              echo "$body" | jq .
              if echo "$body" | jq -e '.ok == true and .service == "fidgo" and .database == "up" and .wallet.https == true' >/dev/null; then
                echo "Fidgo production health is green."
                exit 0
              fi
              echo "Endpoint answered but is not ready yet."
            else
              echo "Endpoint not ready yet."
            fi
            sleep 30
          done
          echo "Production health did not become ready in time."
          exit 1
