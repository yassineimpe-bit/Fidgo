name: production-smoke

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Stagger away from the top of the hour to reduce shared-runner contention.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: retiko-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      # Domaine canonique Retiko. Le smoke doit valider la vraie URL publique,
      # pas l'alias technique Vercel.
      PUBLIC_URL: https://retiko.fr
      HEALTH_URL: https://retiko.fr/api/health
    steps:
      - name: Check public Retiko shell
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 \
            --retry 2 --retry-delay 2 \
            --output /dev/null "$PUBLIC_URL/"

      - name: Wait for Retiko production health
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for $HEALTH_URL"

          for attempt in $(seq 1 8); do
            echo "Attempt $attempt/8"
            rm -f /tmp/retiko-health-body

            http_code=$(curl --silent --show-error --max-time 15 \
              -o /tmp/retiko-health-body -w '%{http_code}' "$HEALTH_URL" || true)
            body=$(cat /tmp/retiko-health-body 2>/dev/null || true)

            echo "HTTP $http_code"
            if echo "$body" | jq -e . >/dev/null 2>&1; then
              echo "$body" | jq .

              if echo "$body" | jq -e '.ok == true and .service == "retiko" and .database == "up" and .schema == "up" and .auth == "up" and .wallet.https == true' >/dev/null; then
                echo "Retiko production health is green."
                exit 0
              fi

              if echo "$body" | jq -e '.service == "retiko" and .auth == "down"' >/dev/null; then
                echo "::error::Retiko runtime is not configured: AUTH_SECRET is missing in Vercel Production."
                if echo "$body" | jq -e '.database == "down"' >/dev/null; then
                  echo "::error::DATABASE_URL is also missing or unavailable in Vercel Production."
                fi
                exit 1
              fi

              if echo "$body" | jq -e '.service == "retiko" and .database == "up" and .schema == "down"' >/dev/null; then
                echo "::error::Retiko database is reachable but its schema is stale. Apply the pending production migrations before opening the pilot."
                exit 1
              fi

              echo "Retiko answered but is not ready yet."
            else
              echo "Health endpoint did not return valid JSON yet."
              head -c 500 /tmp/retiko-health-body 2>/dev/null || true
              echo
            fi

            sleep 15
          done

          echo "::error::Production health did not become ready after 8 attempts."
          exit 1
