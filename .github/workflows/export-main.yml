name: export-main

on:
  push:
    branches:
      - ops/prod-smoke
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Show exported revision
        run: git rev-parse HEAD

      - name: Package Fidgo main
        run: |
          zip -r /tmp/fidgo-main.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x '.next/*'

      - name: Upload repository archive
        uses: actions/upload-artifact@v4
        with:
          name: fidgo-main
          path: /tmp/fidgo-main.zip
          if-no-files-found: error
          retention-days: 1
