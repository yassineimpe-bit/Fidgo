name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # `npm install` sans lockfile rendait les builds non reproductibles et
      # exposait a une version compromise publiee en amont entre deux deploys.
      - run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Validate production env contract
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://retiko:retiko@db.example.test:5432/retiko?sslmode=require
          AUTH_SECRET: retiko-ci-production-secret-at-least-32-bytes
          NEXT_PUBLIC_APP_URL: https://retiko.fr
          APPLE_WALLET_ENABLED: "false"
          GOOGLE_WALLET_ENABLED: "false"
          CARD_RECOVERY_ENABLED: "false"
          RESEND_API_KEY: re_ci_placeholder
          EMAIL_FROM: "Retiko <cartes@retiko.fr>"
          EMAIL_REPLY_TO: contact@retiko.fr
        run: npm run env:check
      - name: Validate enabled Resend recovery contract
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://retiko:retiko@db.example.test:5432/retiko?sslmode=require
          AUTH_SECRET: retiko-ci-production-secret-at-least-32-bytes
          NEXT_PUBLIC_APP_URL: https://retiko.fr
          APPLE_WALLET_ENABLED: "false"
          GOOGLE_WALLET_ENABLED: "false"
          CARD_RECOVERY_ENABLED: "true"
          RESEND_API_KEY: re_ci_placeholder
          EMAIL_FROM: "Retiko <cartes@retiko.fr>"
          EMAIL_REPLY_TO: contact@retiko.fr
        run: npm run env:check
      - name: Validate enabled Stripe billing contract
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://retiko:retiko@db.example.test:5432/retiko?sslmode=require
          AUTH_SECRET: retiko-ci-production-secret-at-least-32-bytes
          NEXT_PUBLIC_APP_URL: https://retiko.fr
          APPLE_WALLET_ENABLED: "false"
          GOOGLE_WALLET_ENABLED: "false"
          CARD_RECOVERY_ENABLED: "false"
          RESEND_API_KEY: re_ci_placeholder
          EMAIL_FROM: "Retiko <cartes@retiko.fr>"
          EMAIL_REPLY_TO: contact@retiko.fr
          STRIPE_ENABLED: "true"
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          STRIPE_PRICE_FLEX_MONTHLY: price_ci_flex
          STRIPE_PRICE_RETIKO12_MONTHLY: price_ci_retiko12
          STRIPE_PRICE_ANNUAL: price_ci_annual
        run: npm run env:check
      - name: Reject technical Vercel URL as canonical production URL
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://retiko:retiko@db.example.test:5432/retiko?sslmode=require
          AUTH_SECRET: retiko-ci-production-secret-at-least-32-bytes
          NEXT_PUBLIC_APP_URL: https://fidgo-env-probe.vercel.app
          APPLE_WALLET_ENABLED: "false"
          GOOGLE_WALLET_ENABLED: "false"
          CARD_RECOVERY_ENABLED: "false"
          RESEND_API_KEY: re_ci_placeholder
          EMAIL_FROM: "Retiko <cartes@retiko.fr>"
          EMAIL_REPLY_TO: contact@retiko.fr
        shell: bash
        run: |
          if npm run env:check; then
            echo "::error::env:check accepted a non-canonical production URL"
            exit 1
          fi
          echo "Non-canonical production URL correctly rejected."
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Build with secret sentinels and audit browser artifacts
        env:
          DATABASE_URL: postgres://retiko_build:client-secret-db-sentinel@db.example.test:5432/retiko
          AUTH_SECRET: retiko-client-secret-auth-sentinel-at-least-32-bytes
          CRON_SECRET: retiko-client-secret-cron-sentinel
          RESEND_API_KEY: re_retiko_client_secret_sentinel
          STRIPE_SECRET_KEY: sk_test_retiko_client_secret_sentinel
          STRIPE_WEBHOOK_SECRET: whsec_retiko_client_secret_sentinel
          APPLE_WWDR_CERT_BASE64: retiko-client-secret-wwdr-sentinel
          APPLE_SIGNER_CERT_BASE64: retiko-client-secret-cert-sentinel
          APPLE_SIGNER_KEY_BASE64: retiko-client-secret-key-sentinel
          APPLE_SIGNER_KEY_PASSPHRASE: retiko-client-secret-passphrase-sentinel
          GOOGLE_WALLET_SERVICE_ACCOUNT_JSON_BASE64: retiko-client-secret-google-sentinel
          FIDGO_GITHUB_TOKEN: github_pat_retiko_client_secret_sentinel
          NEON_API_KEY: napi_retiko_client_secret_sentinel
          VAPID_PRIVATE_KEY: retiko-client-secret-vapid-sentinel
          DEMO_OWNER_PASSWORD: retiko-client-secret-demo-password-sentinel
        run: npm run build && npm run security:client-secrets

  e2e:
    runs-on: ubuntu-latest
    # La suite complète dépasse ponctuellement 15 min sur les runners partagés
    # alors qu'elle ne présente pas d'erreur fonctionnelle. Garder une marge
    # évite de transformer la vitesse du runner en faux signal rouge.
    # Septembre 2026 : 23 à 24 min par run ; un run a été annulé à 25 min
    # (#156), d'où la marge portée à 40 min.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fidgo
          POSTGRES_PASSWORD: fidgo
          POSTGRES_DB: fidgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fidgo -d fidgo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fidgo:fidgo@127.0.0.1:5432/fidgo_test
      AUTH_SECRET: fidgo-ci-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run db:setup
      - name: Replay database setup (idempotency)
        run: npm run db:setup
      - name: Verify database integrity after setup
        run: npm run db:verify
      - run: npm run test:e2e
      - name: Verify database integrity after E2E
        run: npm run db:verify
